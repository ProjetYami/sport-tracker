<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Debug</title>
<style>
body{background:#02030a;color:#fff;font-family:monospace;padding:20px;font-size:12px}
pre{background:#0a1020;padding:15px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-all}
button{background:#00e5ff;color:#001a2a;padding:10px 20px;border:0;border-radius:10px;font-weight:900;margin:10px 0}
</style>
</head>
<body>
<h2>🔍 Contenu du localStorage</h2>
<button onclick="location.reload()">🔄 Recharger</button>
<pre id="out"></pre>
<script>
const out = document.getElementById('out');
let html = '';

// Toutes les clés
for(let i = 0; i < localStorage.length; i++){
  const key = localStorage.key(i);
  const val = localStorage.getItem(key);
  html += '=== CLÉ : ' + key + ' ===\n';
  try{
    const obj = JSON.parse(val);
    if(typeof obj === 'object'){
      html += JSON.stringify(obj, null, 2) + '\n\n';
    } else {
      html += obj + '\n\n';
    }
  }catch(e){
    html += '(non JSON) ' + val + '\n\n';
  }
}
out.textContent = html || 'Aucune donnée dans localStorage';
</script>
</body>
</html>
